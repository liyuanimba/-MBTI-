                audio.play().catch(e => {});
            }
            
            function playCaptureSound() {
                const audio = new Audio(musicAssets.success);
                audio.volume = 0.4;
                audio.play().catch(e => {});
            }
            
            function playResultMusic() {
                // 停止欢迎音乐
                if (welcomeAudio) {
                    welcomeAudio.pause();
                    welcomeAudio = null;
                }
                
                // 随机选择一首结果音乐
                const randomIndex = Math.floor(Math.random() * musicAssets.result.length);
                resultAudio = new Audio(musicAssets.result[randomIndex]);
                resultAudio.loop = true;
                resultAudio.volume = 0.4;
                resultAudio.play().catch(e => console.log('音乐播放需要用户交互'));
            }
            
            // 新增：表情分析框架 - 每张照片的贡献分析
            let emotionAnalyses = []; // 存储每张表情的分析结果
            
            function analyzeEmotionFromPhoto(photoData, emotionName, index) {
                const emotion = emotions.find(e => e.name === emotionName);
                let contribution = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                let analysisText = '';
                
                // 引入轻微的随机性，增加结果个性化，范围 ±0.3
                const randomFactor = () => (Math.random() * 0.6 - 0.3);
                
                // 基于表情的基础影响力 + 轻微随机
                const base = emotion.mbtiInfluence;
                if (base.E) contribution.E = base.E + randomFactor();
                if (base.I) contribution.I = base.I + randomFactor();
                if (base.S) contribution.S = base.S + randomFactor();
                if (base.N) contribution.N = base.N + randomFactor();
                if (base.T) contribution.T = base.T + randomFactor();
                if (base.F) contribution.F = base.F + randomFactor();
                if (base.J) contribution.J = base.J + randomFactor();
                if (base.P) contribution.P = base.P + randomFactor();
                
                // 确保分值为正
                Object.keys(contribution).forEach(key => {
                    if (contribution[key] < 0) contribution[key] = 0;
                });
                
                // 针对不同表情生成个性化分析文本
                if (emotionName === '开心') {
                    analysisText = `表情展现阳光开朗，充满积极能量，社交表现力佳`;
                } else if (emotionName === '悲伤') {
                    analysisText = `表情展现共情能力，情感细腻且富有深度`;
                } else if (emotionName === '惊讶') {
                    analysisText = `表情展现对新奇事物的敏感性，直觉能力出色`;
                } else if (emotionName === '愤怒') {
                    analysisText = `表情展现决断力和行动力，目标导向明确`;
                } else if (emotionName === '平静') {
                    analysisText = `表情展现内在平衡，情绪稳定性高，善于思考`;
                } else if (emotionName === '好奇') {
                    analysisText = `表情展现探索欲和求知欲，创新思维活跃`;
                } else if (emotionName === '兴奋') {
                    analysisText = `表情展现热情活力，感染力强，适应变化快`;
                } else if (emotionName === '思考') {
                    analysisText = `表情展现理性思维，分析能力强，决策审慎`;
                }
                
                return {
                    emotion: emotionName,
                    index: index,
                    contribution: contribution,
                    analysisText: analysisText,
                    algorithmUsed: '科学均衡MBTI算法v5.0'
                };
            }
            
            function analyzePersonality() {
                let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                emotionAnalyses = [];
                
                // 对每张表情进行算法分析
                capturedPhotos.forEach((photo, index) => {
                    const analysis = analyzeEmotionFromPhoto(photo.photo, photo.emotion, index);
                    emotionAnalyses.push(analysis);
                    
                    // 累加贡献值
                    for (let dim in analysis.contribution) {
                        scores[dim] += analysis.contribution[dim];
                    }
                });
                
                // 基础维度判断
                let dimE = scores.E >= scores.I ? 'E' : 'I';
                let dimS = scores.S >= scores.N ? 'S' : 'N';
                let dimT = scores.T >= scores.F ? 'T' : 'F';
                let dimJ = scores.J >= scores.P ? 'J' : 'P';
                
                // 计算各维度的分数差，增强多样性
                const diffE = Math.abs(scores.E - scores.I);
                const diffS = Math.abs(scores.S - scores.N);
                const diffT = Math.abs(scores.T - scores.F);
                const diffJ = Math.abs(scores.J - scores.P);
                
                // 如果某一维度差距过小，引入轻微随机因子增加结果多样性
                if (diffE < 1) dimE = Math.random() > 0.5 ? 'E' : 'I';
                if (diffS < 1) dimS = Math.random() > 0.5 ? 'S' : 'N';
                if (diffT < 1) dimT = Math.random() > 0.5 ? 'T' : 'F';
                if (diffJ < 1) dimJ = Math.random() > 0.5 ? 'J' : 'P';
                
                let type = dimE + dimS + dimT + dimJ;
                
                return {
                    type: type,
                    scores: scores,
                    emotionAnalyses: emotionAnalyses,
                    dimensions: [
                        { name: '外向 E - 内向 I', left: 'E', right: 'I', leftScore: scores.E, rightScore: scores.I },
                        { name: '感觉 S - 直觉 N', left: 'S', right: 'N', leftScore: scores.S, rightScore: scores.N },
                        { name: '思考 T - 情感 F', left: 'T', right: 'F', leftScore: scores.T, rightScore: scores.F },
                        { name: '判断 J - 感知 P', left: 'J', right: 'P', leftScore: scores.J, rightScore: scores.P }
                    ]
                };
            }
            
            startTestBtn.addEventListener('click', async function() {
                console.log('🎮 点击开始测试');
                
                startTestBtn.innerHTML = '🔍 正在准备测试...';
                startTestBtn.disabled = true;
                
                try {
                    console.log('🔍 请求摄像头权限...');
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
                    });
                    
                    document.getElementById('captureCamera').srcObject = cameraStream;
                    
                    // 预加载第一轮图片，确保加载好再进入测试
                    console.log('🖼️ 预加载第一轮图片...');
                    const firstEmotion = emotions[0];
                    let firstImageLoaded = false;
                    const firstImg = new Image();
                    const firstImgUrl = getEmotionImage(firstEmotion.name);
                    firstImg.src = firstImgUrl;
                    
                    firstImg.onload = () => {
                        preloadedImages[firstEmotion.name] = firstImgUrl;
                        console.log('✅ 第一轮图片预加载完成！');
                    };
                    firstImg.onerror = () => {
                        // 如果加载失败，用备用
                        const randomId = Math.floor(Math.random() * 16) + 1;
                        preloadedImages[firstEmotion.name] = `https://placekitten.com/400/400?image=${randomId}`;
                    };
                    
                    // 预加载其他图片
                    preloadImages();
                    playWelcomeMusic();
                    
                    currentStep = 2;
                    currentEmotionIndex = 0;
                    updateSteps();
                    
                    // 等待一小会儿确保第一轮图片加载或备用准备好
                    setTimeout(() => showEmotion(), 300);
                    
                    console.log('✅ 测试准备完成！');
                } catch (error) {
                    console.error('❌ 摄像头错误:', error);
                    alert('无法启动摄像头！\n错误: ' + error.message + '\n\n请确保：\n1. 使用HTTPS\n2. 允许浏览器访问摄像头');
                    startTestBtn.innerHTML = '🎮 开始测试';
                    startTestBtn.disabled = false;
                }
            });
            
            confirmYesBtn.addEventListener('click', function() {
                console.log('✅ 用户点击了确认！');
                const lastResult = recognitionResults[recognitionResults.length - 1];
                if (lastResult) lastResult.confirmed = true;
                currentEmotionIndex++;
                
                console.log('🎯 当前轮次:', currentEmotionIndex, '/', emotions.length);
                if (currentEmotionIndex >= emotions.length) {
                    console.log('🚀 所有表情收集完成！调用 endTest()');
                    endTest();
                } else {
                    console.log('🎨 继续下一轮表情');
                    showEmotion();
                }
            });
            
            confirmNoBtn.addEventListener('click', function() {
                capturedPhotos.pop();
                recognitionResults.pop();
                showEmotion();
            });
            
            restartTestBtn.addEventListener('click', function() {
                if (musicInterval) clearInterval(musicInterval);
                currentStep = 1;
                currentEmotionIndex = 0;
                capturedPhotos = [];
                recognitionResults = [];
                updateSteps();
                resultContainer.innerHTML = '<p style="text-align: center; color: #999; font-size: 16px;">🧙‍♀️ AI正在分析你的人格...</p>';
                restartTestBtn.style.display = 'none';
                shareResultBtn.style.display = 'none';
                startTestBtn.innerHTML = '🎮 开始测试';
                startTestBtn.disabled = false;
            });
            
            shareResultBtn.addEventListener('click', function() {
                if (navigator.share) {
                    navigator.share({
                        title: '🤖 AI表情识别MBTI测试',
                        text: '快来通过AI表情识别测试你的MBTI人格类型！',
                        url: window.location.href
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert('链接已复制到剪贴板！');
                }
            });
            
            updateSteps();
            console.log('✅ 初始化完成！');
        });
    </script>
